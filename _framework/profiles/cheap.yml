# Profile: cheap — Architect=Kimi K2 (OpenRouter), Mechanic=local Ollama. Cost: ~$0.20/day.
# Requires: OPENROUTER_API_KEY env var, Ollama with qwen2.5-coder pulled.

name: webhook-dashboard

team:
  name: dev-learning

rows:
  - size: 55%
    panes:
      - title: Architect (Kimi K2)
        command: bash -c "aider --model openrouter/moonshotai/kimi-k2 --read ../../_framework/agents/architect.md --no-auto-commits"
        role: lead
        focus: true
        task: |
          ROLE: Architect (concepts/why). System prompt auto-loaded via --read flag.

      - title: Mechanic (Ollama)
        command: bash -c "ollama run qwen2.5-coder"
        role: teammate
        task: |
          ROLE: Mechanic (code/fixes). Paste agents/mechanic.md as first message after qwen loads.

  - size: 30%
    panes:
      - title: Server
        command: bash
      - title: Logs
        command: bash
      - title: psql
        command: bash
      - title: Shell
        command: bash

  - size: 15%
    panes:
      - title: Bruno
        command: bash

theme:
  accent: colour75
  border: colour238
